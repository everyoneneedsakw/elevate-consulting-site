name: Rebuild site from CMS content

# Runs whenever Pages CMS (or anyone) commits a content/template change to
# this branch, and regenerates the live HTML pages from content/*.yml +
# templates/*.html. Only touches content/, templates/, scripts/ as triggers
# — never the built HTML pages themselves — so this cannot loop.
on:
  push:
    branches: [elevate-cinematic-v4-review]
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/build.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elevate-cinematic-v4-review

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: python3 scripts/build.py

      - name: Commit rebuilt pages, if any changed
        run: |
          git config user.name "elevate-cms-build"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi
          git add -A -- ':!content' ':!templates' ':!scripts' ':!.pages.yml' ':!.github'
          git commit -m "Rebuild site from CMS content changes"
          git push
