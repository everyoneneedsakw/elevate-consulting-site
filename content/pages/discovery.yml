seo:
  title: Client Discovery Application | Elevate Consulting & Concierge
  description: A guided discovery application for prospective Elevate Consulting
    & Concierge clients.
welcome:
  title: "Let's Talk About Your Business"
  intro1: "Tell us about your business, the ideas you're excited about, and
    where you could use some support. We want to understand what you're
    working toward and what would make a difference for you."
  intro2: "You don't need to have everything figured out. Share your thoughts
    in your own words, whether you have a clear vision or are still exploring
    what's next. This gives us a place to begin our conversation."
  saving_note: "Your answers save automatically on this device as you go, so
    you can step away and come back later on this same browser."
  start_button: "Let's Get Into It"
confirmation:
  title: "Thank you. We've received your application."
  body: "We appreciate you sharing your ideas, goals, and where you could use
    support. Our team will review your answers and follow up with you about
    next steps."
