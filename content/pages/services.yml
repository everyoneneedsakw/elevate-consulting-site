seo:
  title: "Business Operations Services | Elevate Consulting"
  description: "Explore Elevate Consulting's core services — Google Workspace systems, SOPs & playbooks, CRM & automation, and operations consulting — built and implemented for service-based businesses, not just recommended."
  og_title: "Business Operations Services | Elevate Consulting"
  og_description: "Google Workspace systems, SOPs & playbooks, CRM & automation, and operations consulting — diagnosed first, then actually built."

site:
  brand_text: "Elevate Consulting"

hero:
  eyebrow: "What We Help You Build"
  headline_line1: "Systems That Actually Get Built"
  headline_prefix: "— Not Just "
  headline_italic: "Recommended."
  paragraph: "We help service-based businesses fix the operational stuff that's quietly costing them time, money, and sanity — disorganized files, undocumented processes, a CRM nobody trusts, and the general feeling that growth just means more chaos. We don't just tell you what's wrong. We build the systems that fix it."
  cta_primary: "Book a Discovery Call"
  cta_secondary: "See the Services"
  tag1: "Google Workspace · SOPs · CRM · Operations"
  tag2: "Diagnose First, Build Second"
  tag3: "Built to Be Used — Not Just Delivered"

problem:
  eyebrow: "Recognize the Problem"
  headline_line1: "If Any of This Sounds Familiar,"
  headline_line2: "You're Not Alone."
  paragraph: "Every business we work with recognizes at least one of these. Most recognize all three."
  card1_title: "Knowledge Lives in One Person's Head"
  card1_desc: "Your best processes were never written down — they live in your head, or one key employee's. When that person is out, busy, or gone, the process goes with them."
  card2_title: "Everyone Does It a Little Differently"
  card2_desc: "Three people on your team handle the same task three different ways. There's technically a system in place — but nobody's really following it, so the client experience depends on who picks up the phone."
  card3_title: "Things Fall Through the Cracks"
  card3_desc: "Leads go cold because follow-up depended on memory. Software was purchased to fix this and now sits half-used. And somehow, you're still the one everything eventually gets routed back to."

core:
  eyebrow: "What We Build"
  headline_line1: "Four Ways We Help You Get Organized"
  headline_line2: "— and Stay That Way."
  paragraph: "Every engagement starts with figuring out which of these your business actually needs. Sometimes it's one. Sometimes it's all four, working together."
  card1_kicker: "GW"
  card1_title: "Google Workspace Systems"
  card1_desc: "When information lives everywhere — scattered folders, outdated docs, a Drive nobody can navigate — the fix isn't more software. It's structure. We structure your Google Workspace around how your business actually works — creating folders, SOP libraries, dashboards, trackers, and shared systems your team can actually use."
  card1_cta: "Talk to Katie About This"
  card2_kicker: "SOP"
  card2_title: "SOPs & Playbooks"
  card2_desc: "When your best process only exists in one person's head, growth stalls the moment that person is out. We document how your business actually runs into clear, usable SOPs and playbooks — so consistency doesn't depend on who shows up that day."
  card2_cta: "Talk to Katie About This"
  card3_kicker: "CRM"
  card3_title: "CRM & Automation"
  card3_desc: "Leads and clients fall through the cracks when follow-up depends on memory instead of a system. We build the CRM structure and automation — lead tracking, follow-up sequences, the handoffs in between — so the experience your client has stays consistent, because what's happening behind the scenes finally is too."
  card3_cta: "Talk to Katie About This"
  card4_kicker: "OPS"
  card4_title: "Operations Consulting"
  card4_desc: "Sometimes the problem isn't one tool — it's how everything connects. We look at how the business actually operates, identify where execution is breaking down, and build the systems, ownership, reporting, and accountability needed to make the work run more consistently."
  card4_cta: "Talk to Katie About This"

connect:
  eyebrow: "How These Connect"
  headline_line1: "A CRM Problem Isn't"
  headline_line2: "Always a CRM Problem."
  paragraph1: "One of the most common mistakes in operations work is forcing a business into a predetermined package before understanding what's actually broken. A messy CRM might really be a process problem underneath. A stack of unused SOPs might really be a training gap. A disorganized Google Drive might really be a symptom of nobody owning information in the first place."
  paragraph2: "Before we recommend anything, we look at what's actually causing the friction — not just where it shows up. Sometimes that means one service. Sometimes it means several, working together."
  check1: "A CRM problem is sometimes actually a process problem"
  check2: "An SOP problem often exposes a training gap"
  check3: "A disorganized Google Workspace is usually an information-ownership problem"
  check4: "A growth problem is often more than one of these at once"

strategy:
  eyebrow: "Strategy + Implementation"
  headline_line1: "This Isn't a Strategy Document."
  headline_prefix: "It's a "
  headline_italic: "System You Can Run."
  paragraph: "A lot of consulting stops at recommendations — a report, a slide deck, a list of things you should probably do eventually. That's not how we work. We build the systems, put them in place inside your business, teach your team how to use them, and pay attention to what happens once they're actually being used — adjusting where needed until the process works in the real world."

audience:
  eyebrow: "Who This Is For"
  headline_line1: "Built for Businesses Ready to Run"
  headline_line2: "on Systems, Not Sticky Notes."
  paragraph: "The systems below started with the businesses we know best — but the same approach applies anywhere the work depends on people, process, and follow-through."
  card1_title: "Roofing Companies"
  card1_desc: "Estimating chaos, crew coordination, supplement tracking — roofing operations involve more moving pieces than most software is built to handle. These are systems we've worked inside before."
  card1_tag1: "Estimating Systems"
  card1_tag2: "Crew SOPs"
  card1_tag3: "Insurance Workflows"
  card2_title: "Real Estate Professionals"
  card2_desc: "Agents and teams juggling CRM, transaction timelines, and client communication need systems built around how deals actually move — not a generic template."
  card2_tag1: "CRM Cleanup"
  card2_tag2: "Transaction Workflows"
  card2_tag3: "Client Experience"
  card3_title: "Service Businesses"
  card3_desc: "If your business runs on appointments, projects, or client work — and your systems haven't kept pace with your growth — this is exactly the kind of work we do."
  card3_tag1: "Process Documentation"
  card3_tag2: "Team Systems"
  card3_tag3: "Client Journeys"

start:
  eyebrow: "How to Start"
  headline_line1: "Start With a Conversation,"
  headline_italic: "Not a Commitment."
  paragraph: "The easiest way to figure out what your business actually needs is a discovery call — thirty minutes, no pressure, no pitch. If it makes sense to work together, we'll talk about what that looks like. If it doesn't, you'll still walk away with more clarity than you had before."
  cta_label: "Book Your Discovery Call"

finale:
  eyebrow: "Let's Work Together"
  headline_line1: "Ready to Stop Managing Chaos"
  headline_prefix: "and Start Running "
  headline_italic: "Systems?"
  paragraph: "You've seen what we build. If your business is ready for the operational foundation that lets you actually grow, the next step is a conversation."
  cta_primary: "Book a Discovery Call"
  cta_secondary: "Get the Free Audit"
  note: "Free 30-minute call. No commitment required."
