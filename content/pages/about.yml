personal:
  eyebrow: "Beyond the Systems"
  headline_prefix: "The Person Behind "
  headline_italic: "Elevate Consulting."
  paragraph1: "I'm based in Texas and work with clients remotely across the country. What drew me to this work in the first place wasn't operations for its own sake — it was watching a team go from overwhelmed and disorganized to confident, almost overnight, once the right system finally clicked into place."
  paragraph2: "I like the puzzle of a messy operation. I like sitting with the person who's been quietly holding a business together with sticky notes and group texts, and building them something that finally works the way their business actually runs. If that sounds like where your business is right now, I'd like to hear about it."

finale:
  eyebrow: "Let's Work Together"
  headline_line1: "Ready to Build a Business"
  headline_prefix: "That Runs "
  headline_italic: "Without You"
  headline_line2: "in Every Decision?"
  paragraph: "You've read how we think and how we work. If that sounds like what your business needs right now, the next step is a conversation — not a sales pitch."
  cta_primary: "Book a Discovery Call"
  cta_secondary: "Get the Free Audit"
  note: "Free 30-minute call. No commitment required."
