site:
  brand_text: Elevate Consulting & Concierge
hero:
  eyebrow: MEET KATIE WEST
  headline_line1: THE VISIONARY. THE STRATEGIST.
  headline_italic: The Problem-Solver.
  paragraph: >-
    Hi, I'm Katie West, founder of Elevate Consulting & Concierge.


    I've built my career connecting the dots between people, strategy,
    operations, and growth. I see the big picture, notice what others miss, and
    ask the questions that uncover what's really happening beneath the surface.


    Clients often come to me with one challenge, only to discover an entirely
    different opportunity. That's where I thrive! I bring clarity to complexity,
    turning ideas into action, and helping businesses become everything they're
    capable of being.


    Because sometimes the biggest breakthrough isn't another tool or process.
    It's having the right person see what you couldn't see before.
  cta_primary: Let's Talk About The Flow Of Your "Everyday".
  cta_secondary: See How We Work
  tag1: Strategy · Operations · Growth
  tag2: People-First · Solutions-Driven
  tag3: Founder-Led · Texas-Based · Nationwide
