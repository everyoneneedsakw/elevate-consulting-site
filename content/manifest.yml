# Maps each page's template + content file to the real HTML file it builds.
# scripts/build.py reads this. Add an entry here whenever a new page is
# brought onto the CMS. footer: full | minimal (homepage uses minimal).
pages:
  - key: home
    label: "Homepage"
    template: templates/home.html
    content: content/pages/home.yml
    output: index.html
    footer: minimal
  - key: about
    label: "About"
    template: templates/about.html
    content: content/pages/about.yml
    output: about/index.html
    footer: full
  - key: services
    label: "Services"
    template: templates/services.html
    content: content/pages/services.yml
    output: services/index.html
    footer: full
  - key: services-google-workspace-systems
    label: "Services — Google Workspace Systems"
    template: templates/services-coming-soon.html
    content: content/pages/services-google-workspace-systems.yml
    output: services/google-workspace-systems/index.html
    footer: full
  - key: services-sops-playbooks
    label: "Services — SOPs & Playbooks"
